<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路線エディタ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 12px; background: #222; color: #fff; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  header .ttl { font-weight: 700; font-size: 16px; }
  header label { font-size: 12px; color: #ccc; }
  header input[type=text] { font-size: 14px; padding: 3px 6px; border-radius: 4px; border: none; }
  header input[type=number] { width: 60px; font-size: 14px; padding: 3px 6px; border-radius: 4px; border: none; }
  header input[type=color] { width: 36px; height: 24px; border: none; background: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; }
  aside { width: 308px; border-left: 1px solid #ddd; display: flex; flex-direction: column; background: #fafafa; }
  aside .sum { padding: 10px 12px; border-bottom: 1px solid #e3e3e3; font-size: 13px; line-height: 1.7; }
  aside .sum b { font-size: 15px; }
  #stations { flex: 1; overflow-y: auto; padding: 8px; }
  .st { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .st.sel { border-color: #333; box-shadow: 0 0 0 1px #333; }
  .st .no { font-size: 11px; color: #fff; border-radius: 50%; width: 20px; height: 20px; line-height: 20px; text-align: center; flex: none; }
  .st input { flex: 1; min-width: 0; font-size: 14px; border: none; border-bottom: 1px solid #ccc; padding: 2px; }
  .st .km { font-size: 11px; color: #666; white-space: nowrap; }
  .st button { border: none; background: #eee; border-radius: 4px; cursor: pointer; font-size: 12px; padding: 3px 6px; }
  .wp { background: #f3f3f3; border: 1px dashed #bbb; border-radius: 8px; padding: 4px 8px; margin: 0 0 6px 26px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .wp .km { margin-left: auto; font-size: 11px; white-space: nowrap; }
  .wp button { border: none; background: #e4e4e4; border-radius: 4px; cursor: pointer; font-size: 11px; padding: 2px 5px; }
  .seg { font-size: 11px; color: #888; text-align: center; margin: -2px 0 4px; }
  footer { padding: 8px; border-top: 1px solid #e3e3e3; display: flex; flex-wrap: wrap; gap: 6px; }
  footer button { flex: 1; min-width: 120px; padding: 9px 4px; font-size: 13px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; }
  footer button.primary { background: #222; color: #fff; border-color: #222; }
  .mode { padding: 8px 12px; font-size: 12px; background: #fff8e1; border-bottom: 1px solid #e3e3e3; line-height: 2; }
  .mode button { font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid #bbb; background: #fff; cursor: pointer; margin-right: 4px; }
  .mode button.on { background: #ffb300; border-color: #ffb300; font-weight: 700; }
  @media (max-width: 760px) { aside { width: 48vw; } }
</style>
</head>
<body>
<header>
  <span class="ttl">路線エディタ</span>
  <label>路線名 <input type="text" id="lineName" value="新しい路線"></label>
  <label>色 <input type="color" id="lineColor" value="#E6007E"></label>
  <label>最高速度 <input type="number" id="maxSpeed" value="120" min="10" max="400"> km/h</label>
  <label>加速度 <input type="number" id="accel" value="2.5" step="0.1" min="0.1" max="10"> km/h/s</label>
  <label>減速度 <input type="number" id="decel" value="3.5" step="0.1" min="0.1" max="10"> km/h/s</label>
  <label>停車 <input type="number" id="dwell" value="30" step="5" min="0" max="600"> 秒</label>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div class="mode">
      <button id="modeStation" class="on">駅を追加</button><button id="modeWay" >経由点を追加</button>
      <br>地図クリックで追加。線の上をクリックすると経由点を割り込み追加。点はドラッグで移動できます
    </div>
    <div class="sum" id="summary">駅を置いてください</div>
    <div id="stations"></div>
    <footer>
      <button id="dlYaml" class="primary">YAMLを保存</button>
      <button id="dlSvg" class="primary">路線図SVGを保存</button>
      <button id="dlJson">データを保存(JSON)</button>
      <button id="loadJson">データを開く</button>
      <input type="file" id="fileJson" accept=".json,application/json" style="display:none">
      <button id="loadSample">サンプル（山陽空港線）</button>
      <button id="clearAll">全消去</button>
    </footer>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let state = freshState();
let addKind = "st", selected = -1;
let markers = [], polyline = null;

function freshState() {
  return { name: "新しい路線", color: "#E6007E", maxSpeed: 120, accel: 2.5, decel: 3.5, dwell: 30, nodes: [] };
}
function migrate(s) {
  if (s && !s.nodes && Array.isArray(s.stations)) {
    s.nodes = s.stations.map(x => ({ kind: "st", name: x.name, lat: x.lat, lon: x.lon }));
    delete s.stations;
  }
  if (s && s.speed !== undefined && s.maxSpeed === undefined) { s.maxSpeed = 120; }
  if (s && s.accel === undefined) s.accel = 2.5;
  if (s && s.decel === undefined) s.decel = 3.5;
  if (s && s.dwell === undefined) s.dwell = 30;
  return s;
}

const map = L.map("map").setView([34.62, 133.80], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

function haversine(a, b, c, d) {
  const R = 6371.0, p1 = a * Math.PI / 180, p2 = c * Math.PI / 180;
  const dp = (c - a) * Math.PI / 180, dl = (d - b) * Math.PI / 180;
  const x = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// node i までの経路長(km)
function pathCum() {
  const cum = [0];
  for (let i = 0; i + 1 < state.nodes.length; i++) {
    const s = state.nodes[i], t = state.nodes[i + 1];
    cum.push(cum[i] + haversine(s.lat, s.lon, t.lat, t.lon));
  }
  return cum;
}
function stationsOnly() {
  const cum = pathCum(), out = [];
  state.nodes.forEach((n, i) => { if (n.kind === "st") out.push({ node: n, idx: i, km: cum[i] }); });
  return out;
}
// 加速→巡航→減速の台形モデルで走行秒を返す
function runTimeSec(distKm) {
  const vmax = state.maxSpeed / 3.6, acc = state.accel / 3.6, dec = state.decel / 3.6;
  const d = distKm * 1000;
  if (vmax <= 0 || acc <= 0 || dec <= 0 || d <= 0) return 0;
  const dAcc = vmax * vmax / (2 * acc), dDec = vmax * vmax / (2 * dec);
  if (d >= dAcc + dDec) return vmax / acc + vmax / dec + (d - dAcc - dDec) / vmax;
  const v = Math.sqrt(2 * d / (1 / acc + 1 / dec));
  return v / acc + v / dec;
}
function fmt(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function fmtTime(sec) {
  sec = Math.round(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? m + "分" + (s ? s + "秒" : "") : s + "秒";
}

function saveLocal() { try { localStorage.setItem("rail-editor", JSON.stringify(state)); } catch (e) {} }
function loadLocal() {
  try {
    const s = localStorage.getItem("rail-editor");
    if (s) { state = migrate(JSON.parse(s)); return true; }
  } catch (e) {}
  return false;
}

function render() {
  $("lineName").value = state.name;
  $("lineColor").value = state.color;
  $("maxSpeed").value = state.maxSpeed;
  $("accel").value = state.accel;
  $("decel").value = state.decel;
  $("dwell").value = state.dwell;
  $("modeStation").className = addKind === "st" ? "on" : "";
  $("modeWay").className = addKind === "wp" ? "on" : "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (polyline) { map.removeLayer(polyline); polyline = null; }
  let stNo = 0;
  state.nodes.forEach((n, i) => {
    let icon;
    if (n.kind === "st") {
      stNo++;
      icon = L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
        html: '<div style="background:' + state.color + ';color:#fff;border:2px solid #fff;border-radius:50%;width:22px;height:22px;line-height:19px;text-align:center;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4)">' + stNo + "</div>" });
    } else {
      icon = L.divIcon({ className: "", iconSize: [12, 12], iconAnchor: [6, 6],
        html: '<div style="background:#fff;border:2px solid #888;transform:rotate(45deg);width:10px;height:10px;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>' });
    }
    const m = L.marker([n.lat, n.lon], { draggable: true, icon }).addTo(map);
    if (n.kind === "st") m.bindTooltip(n.name, { direction: "top", offset: [0, -12] });
    m.on("dragend", () => { const p = m.getLatLng(); n.lat = p.lat; n.lon = p.lng; render(); });
    m.on("click", () => { selected = i; renderPanel(); });
    markers.push(m);
  });
  if (state.nodes.length > 1) {
    polyline = L.polyline(state.nodes.map(n => [n.lat, n.lon]), { color: state.color, weight: 6, opacity: 0.85 }).addTo(map);
    polyline.on("click", e => {
      if (addKind !== "wp") return;
      let best = 1, bestD = Infinity;
      for (let i = 0; i + 1 < state.nodes.length; i++) {
        const a = state.nodes[i], b = state.nodes[i + 1];
        const mx = (a.lat + b.lat) / 2, my = (a.lon + b.lon) / 2;
        const d = haversine(e.latlng.lat, e.latlng.lng, mx, my);
        if (d < bestD) { bestD = d; best = i + 1; }
      }
      state.nodes.splice(best, 0, { kind: "wp", lat: e.latlng.lat, lon: e.latlng.lng });
      selected = best;
      render();
      L.DomEvent.stopPropagation(e);
    });
  }
  renderPanel();
  saveLocal();
}

function renderPanel() {
  const sts = stationsOnly();
  const cum = pathCum();
  const total = cum.length ? cum[cum.length - 1] : 0;
  let runTotal = 0;
  for (let i = 0; i + 1 < sts.length; i++) runTotal += runTimeSec(sts[i + 1].km - sts[i].km);
  const dwellTotal = Math.max(0, sts.length - 2) * state.dwell + (sts.length >= 2 ? 0 : 0);
  const grand = runTotal + Math.max(0, sts.length - 2) * state.dwell;
  $("summary").innerHTML = sts.length
    ? "<b>" + state.name + "</b>　全長 <b>" + fmt(total) + " km</b>　所要 約 <b>" + fmtTime(grand) + "</b><br>駅数 " + sts.length + "（走行 " + fmtTime(runTotal) + " ＋ 停車 " + Math.max(0, sts.length - 2) * state.dwell + " 秒）"
    : "駅を置いてください";
  const box = $("stations");
  box.innerHTML = "";
  let stNo = 0;
  state.nodes.forEach((n, i) => {
    if (n.kind === "st") {
      stNo++;
      const div = document.createElement("div");
      div.className = "st" + (i === selected ? " sel" : "");
      div.innerHTML = '<span class="no" style="background:' + state.color + '">' + stNo + '</span>' +
        '<input type="text" value="' + (n.name || "").replace(/"/g, "&quot;") + '">' +
        '<span class="km">' + fmt(cum[i]) + " km</span>" +
        "<button data-act='conv' title='経由点にする'>経</button><button data-act='up'>↑</button><button data-act='down'>↓</button><button data-act='del'>✕</button>";
      div.querySelector("input").addEventListener("change", e => { n.name = e.target.value; render(); });
      div.querySelectorAll("button").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); nodeAction(i, b.dataset.act); }));
      div.addEventListener("click", () => { selected = i; renderPanel(); });
      box.appendChild(div);
      const myKm = cum[i];
      const next = sts[stNo];
      if (next) {
        const d = next.km - myKm;
        const sd = document.createElement("div");
        sd.className = "seg";
        sd.textContent = "↓ " + fmt(d) + " km ・ 走行 " + fmtTime(runTimeSec(d));
        box.appendChild(sd);
      }
    } else {
      const div = document.createElement("div");
      div.className = "wp" + (i === selected ? " sel" : "");
      div.innerHTML = "<span>◆ 経由点</span>" +
        '<span class="km">' + fmt(cum[i]) + " km</span>" +
        "<button data-act='conv' title='駅にする'>駅</button><button data-act='up'>↑</button><button data-act='down'>↓</button><button data-act='del'>✕</button>";
      div.querySelectorAll("button").forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); nodeAction(i, b.dataset.act); }));
      div.addEventListener("click", () => { selected = i; renderPanel(); });
      box.appendChild(div);
    }
  });
}
function nodeAction(i, act) {
  const n = state.nodes[i];
  if (act === "del") state.nodes.splice(i, 1);
  if (act === "up" && i > 0) { state.nodes[i] = state.nodes[i - 1]; state.nodes[i - 1] = n; }
  if (act === "down" && i + 1 < state.nodes.length) { state.nodes[i] = state.nodes[i + 1]; state.nodes[i + 1] = n; }
  if (act === "conv") {
    if (n.kind === "st") { n.kind = "wp"; delete n.name; }
    else { n.kind = "st"; n.name = "駅"; }
  }
  render();
}

map.on("click", e => {
  if (addKind === "st") state.nodes.push({ kind: "st", name: "駅" + (stationsOnly().length + 1), lat: e.latlng.lat, lon: e.latlng.lng });
  else state.nodes.push({ kind: "wp", lat: e.latlng.lat, lon: e.latlng.lng });
  selected = state.nodes.length - 1;
  render();
});
$("modeStation").addEventListener("click", () => { addKind = "st"; render(); });
$("modeWay").addEventListener("click", () => { addKind = "wp"; render(); });
$("lineName").addEventListener("change", e => { state.name = e.target.value; renderPanel(); saveLocal(); });
$("lineColor").addEventListener("change", e => { state.color = e.target.value; render(); });
$("maxSpeed").addEventListener("change", e => { state.maxSpeed = parseFloat(e.target.value) || 120; renderPanel(); saveLocal(); });
$("accel").addEventListener("change", e => { state.accel = parseFloat(e.target.value) || 2.5; renderPanel(); saveLocal(); });
$("decel").addEventListener("change", e => { state.decel = parseFloat(e.target.value) || 3.5; renderPanel(); saveLocal(); });
$("dwell").addEventListener("change", e => { state.dwell = parseFloat(e.target.value) || 0; renderPanel(); saveLocal(); });

function download(filename, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: type || "text/plain;charset=utf-8" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function yamlText() {
  const sts = stationsOnly();
  let y = "line: " + state.name + "\ncolor: \"" + state.color + "\"\nmax_speed_kmh: " + state.maxSpeed + "\nstations:\n";
  sts.forEach(s => {
    y += "  - name: " + s.node.name + "\n    km: " + fmt(s.km) + "\n    lat: " + s.node.lat.toFixed(6) + "\n    lon: " + s.node.lon.toFixed(6) + "\n";
  });
  return y;
}
$("dlYaml").addEventListener("click", () => download(state.name + ".yaml", "\uFEFF" + yamlText()));
$("dlJson").addEventListener("click", () => download(state.name + ".json", JSON.stringify(state, null, 2), "application/json"));
$("loadJson").addEventListener("click", () => $("fileJson").click());
$("fileJson").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => { state = migrate(JSON.parse(t)); selected = -1; render(); fitMap(); });
});
$("clearAll").addEventListener("click", () => { if (confirm("全部消しますか？")) { state.nodes = []; selected = -1; render(); } });
$("loadSample").addEventListener("click", () => { state = JSON.parse(JSON.stringify(SAMPLE)); selected = -1; render(); fitMap(); });
function fitMap() { if (state.nodes.length) map.fitBounds(state.nodes.map(n => [n.lat, n.lon]), { padding: [40, 40] }); }

function svgText() {
  const sts = stationsOnly();
  const cum = pathCum();
  const total = cum.length ? cum[cum.length - 1] : 0;
  let runTotal = 0;
  for (let i = 0; i + 1 < sts.length; i++) runTotal += runTimeSec(sts[i + 1].km - sts[i].km);
  const grand = runTotal + Math.max(0, sts.length - 2) * state.dwell;
  const W = 1240, H = 460, x0 = 90, x1 = 1150, y = 210;
  const xs = sts.map(s => total > 0 ? x0 + (x1 - x0) * (s.km / total) : x0);
  let g = '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  g += "<style>text{font-family:'Yu Gothic','YuGothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#222}.t{font-size:30px;font-weight:700}.st{font-size:21px;font-weight:700}.sm{font-size:12px;fill:#666}</style>";
  g += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';
  g += '<text x="50" y="60" class="t">' + state.name + "</text>";
  g += '<text x="50" y="88" class="sm">全長 ' + fmt(total) + " km ・ 駅数 " + sts.length + " ・ 所要 約 " + fmtTime(grand) + "（最高 " + state.maxSpeed + " km/h・加速度 " + state.accel + " km/h/s）</text>";
  g += '<polyline points="' + xs.map(x => x + "," + y).join(" ") + '" fill="none" stroke="' + state.color + '" stroke-width="9" stroke-linejoin="round"/>';
  sts.forEach((s, i) => {
    g += '<circle cx="' + xs[i] + '" cy="' + y + '" r="11" fill="#fff" stroke="' + state.color + '" stroke-width="5"/>';
    g += '<text x="' + xs[i] + '" y="' + (y - 34) + '" class="st" text-anchor="middle">' + s.node.name + "</text>";
    g += '<text x="' + xs[i] + '" y="' + (y + 42) + '" class="sm" text-anchor="middle">' + fmt(s.km) + " km</text>";
    if (i + 1 < sts.length) g += '<text x="' + ((xs[i] + xs[i + 1]) / 2) + '" y="' + (y - 14) + '" class="sm" text-anchor="middle">' + fmt(sts[i + 1].km - s.km) + " km</text>";
  });
  g += '<text x="50" y="' + (H - 24) + '" class="sm">※ 距離は地図上の実経路から計算。所要時間は加速・巡航・減速モデル＋停車時間</text></svg>';
  return g;
}
$("dlSvg").addEventListener("click", () => download(state.name + "_路線図.svg", svgText(), "image/svg+xml;charset=utf-8"));

const SAMPLE = {
  name: "山陽空港線", color: "#E6007E", maxSpeed: 200, accel: 2.0, decel: 3.0, dwell: 45,
  nodes: [
    { kind: "st", name: "岡山", lat: 34.6664, lon: 133.9186 },
    { kind: "wp", lat: 34.6600, lon: 133.8500 },
    { kind: "st", name: "倉敷", lat: 34.6280, lon: 133.7720 },
    { kind: "wp", lat: 34.5900, lon: 133.6800 },
    { kind: "wp", lat: 34.5480, lon: 133.6120 },
    { kind: "st", name: "浅口", lat: 34.5270, lon: 133.5850 },
    { kind: "st", name: "里庄", lat: 34.5130, lon: 133.5580 },
    { kind: "wp", lat: 34.4720, lon: 133.5500 },
    { kind: "st", name: "山陽国際空港", lat: 34.4350, lon: 133.5450 }
  ]
};

if (!loadLocal() || !state.nodes || !state.nodes.length) {
  state = JSON.parse(JSON.stringify(SAMPLE));
}
render();
fitMap();
</script>
</body>
</html>
